<!-- Pre-auth chrome: minimal nav (brand-mark only). -->
<nav class="nav nav-min">
  <div class="nav-inner">
    <a class="brand-mark" routerLink="/login" aria-label="Partner Portal home">
      <img class="logo" src="logo.png" alt="" width="32" height="32" /><span>Data Sync Pro</span></a>
  </div>
</nav>

<main class="portal">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="logo.png" alt="" width="32" height="32" />
        <span>Partner Portal</span>
      </div>

      <p class="eyebrow"><span class="dot"></span>Partner access</p>
      <h2>Partner <span class="it">sign-in</span></h2>
      <p class="auth-sub">Register deals, track your pipeline, and manage your partnership.</p>

      <form class="auth-form" novalidate (ngSubmit)="submit()">
        <p class="form-error" role="alert" [hidden]="!formError()">{{ formError() }}</p>

        <div class="fld">
          <label class="fl-l" for="login-email">Work email <span class="req">*</span></label>
          <input type="email" id="login-email" name="email" autocomplete="username"
                 placeholder="you@company.com" required
                 #emailInp
                 [(ngModel)]="email"
                 [attr.aria-invalid]="emailError() ? 'true' : null"
                 (blur)="onEmailBlur()" (input)="onEmailInput()" />
          <p class="fl-err" [hidden]="!emailError()">{{ emailError() }}</p>
        </div>

        <div class="fld">
          <label class="fl-l" for="login-pw">Password <span class="req">*</span></label>
          <input type="password" id="login-pw" name="password" autocomplete="current-password"
                 placeholder="Enter your password" required
                 #pwInp
                 [(ngModel)]="password"
                 [attr.aria-invalid]="pwError() ? 'true' : null"
                 (input)="onPwInput()" />
          <p class="fl-err" [hidden]="!pwError()">{{ pwError() }}</p>
        </div>

        <button class="btn" type="submit" [disabled]="!formValid || submitting()">
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
          <svg class="arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m0 0L9 4m4 4L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="auth-help">For registered partners only. Need access? Contact your partner manager.</p>
    </div>
  </div>
</main>

<app-footer variant="login"></app-footer>
